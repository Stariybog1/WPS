<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Reading Trainer</title>
  <style>
    :root {
      --bg: #0d1020;
      --panel: rgba(255,255,255,.08);
      --panel-strong: rgba(255,255,255,.12);
      --text: #f7f8ff;
      --muted: #a8aec7;
      --primary: #7c6cff;
      --primary-2: #37d5bd;
      --danger: #ff6b81;
      --line: rgba(255,255,255,.12);
      --radius: 22px;
      --shadow: 0 25px 80px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(124,108,255,.22), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(55,213,189,.16), transparent 28%),
        var(--bg);
      color: var(--text);
    }

    body {
      padding: 24px;
    }

    button, textarea, input, select {
      font: inherit;
    }

    .app {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 12px 28px rgba(124,108,255,.3);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: -.04em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 4px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 22px;
    }

    .label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      color: var(--text);
      background: rgba(0,0,0,.18);
      outline: none;
      line-height: 1.55;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124,108,255,.16);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 12px;
      align-items: center;
      margin-top: 18px;
    }

    .range-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .speed-box {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      color: var(--text);
      background: rgba(0,0,0,.18);
      text-align: center;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      border: none;
      border-radius: 15px;
      padding: 13px 16px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .primary {
      color: white;
      background: linear-gradient(135deg, var(--primary), #9b70ff);
      box-shadow: 0 12px 24px rgba(124,108,255,.25);
    }

    .secondary {
      color: var(--text);
      background: var(--panel-strong);
      border: 1px solid var(--line);
    }

    .danger {
      color: white;
      background: rgba(255,107,129,.16);
      border: 1px solid rgba(255,107,129,.34);
    }

    .reader {
      min-height: 620px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .reader-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .statline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      padding: 8px 11px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.07);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 700;
    }

    .screen {
      flex: 1;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 430px;
      padding: 30px;
      overflow: hidden;
      border-radius: 20px;
      background:
        linear-gradient(rgba(255,255,255,.025), rgba(255,255,255,.025)),
        #080a13;
      border: 1px solid rgba(255,255,255,.08);
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 45%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.11));
    }

    .screen::before { left: 0; }
    .screen::after {
      right: 0;
      transform: rotate(180deg);
    }

    .focus-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 62px;
      transform: translate(-50%, -50%);
      background: linear-gradient(transparent, var(--primary), transparent);
      opacity: .45;
    }

    .word {
      position: relative;
      z-index: 2;
      max-width: 100%;
      text-align: center;
      font-size: clamp(44px, 8vw, 100px);
      font-weight: 900;
      letter-spacing: -.05em;
      overflow-wrap: anywhere;
      text-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .empty {
      font-size: 20px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0;
    }

    .progress-area {
      margin-top: 18px;
    }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: width .12s linear;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .reader:fullscreen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      background: var(--bg);
      padding: 30px;
    }

    .reader:fullscreen .screen {
      min-height: 0;
    }

    @media (max-width: 900px) {
      body { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .reader { min-height: 540px; }
      .top { align-items: flex-start; }
    }

    @media (max-width: 540px) {
      .top { flex-direction: column; }
      .buttons { grid-template-columns: 1fr; }
      .reader-head { align-items: flex-start; flex-direction: column; }
      .row { grid-template-columns: 1fr 90px; }
      .screen { min-height: 340px; padding: 18px; }
      .word { font-size: clamp(38px, 15vw, 74px); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">SR</div>
        <div>
          <h1>Speed Reading Trainer</h1>
          <div class="subtitle">Paste your text and choose the word display speed</div>
        </div>
      </div>
      <button class="btn secondary" id="fullscreenBtn">Full Screen</button>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <label class="label" for="textInput">Your Text</label>
        <textarea id="textInput" placeholder="Paste or type any text here...">Speed reading helps improve concentration and gradually increase your reading pace. Start at a comfortable speed and raise it little by little.</textarea>

        <div class="row">
          <div class="range-wrap">
            <label class="label" for="speedRange">Words per Second</label>
            <input id="speedRange" type="range" min="0.5" max="10" step="0.5" value="2">
          </div>
          <input class="speed-box" id="speedInput" type="number" min="0.5" max="10" step="0.5" value="2">
        </div>

        <div class="buttons">
          <button class="btn primary" id="startBtn">▶ Start</button>
          <button class="btn secondary" id="pauseBtn" disabled>⏸ Pause</button>
          <button class="btn secondary" id="backBtn">← Previous</button>
          <button class="btn secondary" id="nextBtn">Next →</button>
          <button class="btn danger" id="resetBtn">Reset</button>
          <button class="btn secondary" id="loadBtn">Load Text</button>
        </div>

        <div class="hint">
          Keyboard shortcuts: Space — Start/Pause, Arrow keys — Previous/Next, R — Reset.
        </div>
      </aside>

      <section class="panel reader" id="reader">
        <div class="reader-head">
          <div class="statline">
            <span class="pill" id="speedLabel">2 words/sec</span>
            <span class="pill" id="wpmLabel">120 words/min</span>
            <span class="pill" id="countLabel">0 words</span>
          </div>
          <span class="pill" id="statusLabel">Ready</span>
        </div>

        <div class="screen">
          <div class="focus-mark"></div>
          <div class="word empty" id="wordDisplay">Press “Start”</div>
        </div>

        <div class="progress-area">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text">
            <span id="positionText">0 / 0</span>
            <span id="timeText">Remaining: 0 sec</span>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const textInput = document.getElementById('textInput');
    const speedRange = document.getElementById('speedRange');
    const speedInput = document.getElementById('speedInput');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const loadBtn = document.getElementById('loadBtn');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    const wordDisplay = document.getElementById('wordDisplay');
    const progressFill = document.getElementById('progressFill');
    const positionText = document.getElementById('positionText');
    const timeText = document.getElementById('timeText');
    const speedLabel = document.getElementById('speedLabel');
    const wpmLabel = document.getElementById('wpmLabel');
    const countLabel = document.getElementById('countLabel');
    const statusLabel = document.getElementById('statusLabel');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const reader = document.getElementById('reader');

    let words = [];
    let index = 0;
    let timer = null;
    let isRunning = false;

    function normalizeSpeed(value) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return 2;
      return Math.min(10, Math.max(0.5, Math.round(parsed * 2) / 2));
    }

    function getSpeed() {
      return normalizeSpeed(speedInput.value);
    }

    function updateSpeed(value) {
      const speed = normalizeSpeed(value);
      speedInput.value = speed;
      speedRange.value = speed;
      speedLabel.textContent = `${speed} ${speed === 1 ? 'word' : 'words'}/sec`;
      wpmLabel.textContent = `${Math.round(speed * 60)} words/min`;

      if (isRunning) {
        stopTimer();
        startTimer();
      }
      updateProgress();
    }

    function parseText() {
      words = textInput.value.trim().split(/\s+/).filter(Boolean);
      index = 0;
      countLabel.textContent = `${words.length} ${words.length === 1 ? 'word' : 'words'}`;
      wordDisplay.textContent = words.length ? words[0] : 'Add some text';
      wordDisplay.classList.toggle('empty', words.length === 0);
      statusLabel.textContent = words.length ? 'Ready' : 'No text';
      updateProgress();
    }

    function showCurrentWord() {
      if (!words.length) {
        wordDisplay.textContent = 'Add some text';
        wordDisplay.classList.add('empty');
        return;
      }

      if (index >= words.length) {
        finishReading();
        return;
      }

      wordDisplay.textContent = words[index];
      wordDisplay.classList.remove('empty');
      updateProgress();
    }

    function startTimer() {
      if (!words.length || index >= words.length) return;
      isRunning = true;
      statusLabel.textContent = 'Reading';
      startBtn.disabled = true;
      pauseBtn.disabled = false;

      showCurrentWord();

      const delay = 1000 / getSpeed();
      timer = setInterval(() => {
        index++;
        if (index >= words.length) {
          finishReading();
          return;
        }
        showCurrentWord();
      }, delay);
    }

    function stopTimer() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    function startReading() {
      if (!words.length) parseText();
      if (!words.length) return;
      if (index >= words.length) index = 0;
      stopTimer();
      startTimer();
    }

    function pauseReading() {
      stopTimer();
      isRunning = false;
      statusLabel.textContent = 'Paused';
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    function finishReading() {
      stopTimer();
      isRunning = false;
      index = words.length;
      wordDisplay.textContent = 'Ready!';
      wordDisplay.classList.remove('empty');
      statusLabel.textContent = 'Finished';
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      updateProgress();
    }

    function resetReading() {
      stopTimer();
      isRunning = false;
      index = 0;
      statusLabel.textContent = words.length ? 'Ready' : 'No text';
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      showCurrentWord();
    }

    function stepBack() {
      pauseReading();
      if (!words.length) return;
      index = Math.max(0, index - 1);
      showCurrentWord();
    }

    function stepNext() {
      pauseReading();
      if (!words.length) return;
      index = Math.min(words.length - 1, index + 1);
      showCurrentWord();
    }

    function updateProgress() {
      const total = words.length;
      const current = total ? Math.min(index + 1, total) : 0;
      const percent = total ? (current / total) * 100 : 0;
      progressFill.style.width = `${percent}%`;
      positionText.textContent = `${current} / ${total}`;

      const remainingWords = Math.max(total - current, 0);
      const remainingSeconds = total ? Math.ceil(remainingWords / getSpeed()) : 0;
      timeText.textContent = `${remainingSeconds === 1 ? 'Remaining: 1 sec' : `Remaining: ${remainingSeconds} sec`}`;
    }

    speedRange.addEventListener('input', e => updateSpeed(e.target.value));
    speedInput.addEventListener('change', e => updateSpeed(e.target.value));
    startBtn.addEventListener('click', startReading);
    pauseBtn.addEventListener('click', pauseReading);
    resetBtn.addEventListener('click', resetReading);
    loadBtn.addEventListener('click', () => {
      pauseReading();
      parseText();
    });
    backBtn.addEventListener('click', stepBack);
    nextBtn.addEventListener('click', stepNext);

    fullscreenBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await reader.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.error('Failed to enter fullscreen mode', error);
      }
    });

    document.addEventListener('keydown', event => {
      if (event.target === textInput || event.target === speedInput) return;

      if (event.code === 'Space') {
        event.preventDefault();
        isRunning ? pauseReading() : startReading();
      } else if (event.code === 'ArrowLeft') {
        stepBack();
      } else if (event.code === 'ArrowRight') {
        stepNext();
      } else if (event.key.toLowerCase() === 'r') {
        resetReading();
      }
    });

    parseText();
    updateSpeed(2);
  </script>
</body>
</html>
